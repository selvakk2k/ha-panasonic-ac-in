reset_estimated_energy:
  name: Reset Estimated Energy
  description: Reset the real-time estimated energy counter (kWh) for a MirAIe AC sensor.
  target:
    entity:
      integration: miraie_in
      domain: sensor
  fields:
    value:
      name: Value
      description: New starting energy value in kWh (defaults to 0.0).
      required: false
      default: 0.0
      selector:
        number:
          min: 0
          max: 100000
          step: 0.001
          unit_of_measurement: kWh
          mode: box

